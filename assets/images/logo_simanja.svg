<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#52D6A4" />

  <!-- Wallet body -->
  <rect x="36" y="68" width="128" height="88" rx="16" ry="16" fill="white"/>

  <!-- Wallet flap / top -->
  <rect x="36" y="56" width="128" height="36" rx="10" ry="10" fill="white" opacity="0.85"/>

  <!-- Wallet pocket -->
  <rect x="104" y="94" width="48" height="36" rx="10" ry="10" fill="#52D6A4"/>

  <!-- Coin in pocket -->
  <circle cx="128" cy="112" r="10" fill="white"/>

  <!-- Card lines -->
  <rect x="48" y="98" width="44" height="6" rx="3" fill="#B2EDD9"/>
  <rect x="48" y="112" width="32" height="6" rx="3" fill="#B2EDD9"/>
</svg>
