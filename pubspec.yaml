name: simanja
description: "SIMANJA - Aplikasi Manajemen Keuangan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ─── Native Splash Configuration ────────────────────────────────────────────
# Run:  flutter pub run flutter_native_splash:create
# Reset: flutter pub run flutter_native_splash:remove
flutter_native_splash:
  # White background matching our SplashPage
  color: "#FFFFFF"
  color_dark: "#1A1F2E"

  # Android / iOS only (no web needed)
  android: true
  ios: true
  web: false

  # Keep native splash alive until SplashPage calls FlutterNativeSplash.remove()
  android_gravity: center
  ios_content_mode: center
  fullscreen: false

# ─── Flutter Assets & Fonts ─────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/images/
